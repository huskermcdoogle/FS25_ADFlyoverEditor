<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="sans-serif" role="img"><title>Two-way road split before a T junction, room for one truck</title><desc>A narrow two-way track splits into a lane in and a lane out, close together, which join again at one guard point at the junction mouth. The guard at the mouth and the split guard the short stretch from both ends.</desc>
